<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firefox Theme Switcher</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="logo-title">
        <span class="logo-icon">🌓</span>
        <h1>Theme Switcher</h1>
      </div>
      <button id="btnOpenOptions" class="icon-button" title="Open Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <!-- Main Mode Segmented Control -->
    <div class="mode-selector">
      <button class="mode-btn" data-mode="light" id="btnModeLight">
        <span class="icon">☀️</span>
        <span class="label">Light</span>
      </button>
      <button class="mode-btn" data-mode="dark" id="btnModeDark">
        <span class="icon">🌙</span>
        <span class="label">Dark</span>
      </button>
      <button class="mode-btn" data-mode="auto" id="btnModeAuto">
        <span class="icon">💻</span>
        <span class="label">Auto</span>
      </button>
    </div>

    <!-- Active Status Card -->
    <div class="status-card" id="statusCard">
      <div class="status-indicator">
        <span class="indicator-dot"></span>
        <span class="status-text" id="statusText">Dark Theme Active</span>
      </div>
      <button id="btnQuickToggle" class="quick-toggle-btn">
        Switch to Light
      </button>
    </div>

    <!-- Scope Toggles -->
    <div class="section-title">Apply Theme To</div>
    <div class="toggles-group">
      <label class="toggle-row">
        <span class="toggle-label">
          <strong>Firefox Browser UI</strong>
          <small>Tabs, toolbar, address bar</small>
        </span>
        <input type="checkbox" id="chkBrowserUI" class="switch-checkbox">
        <span class="switch-slider"></span>
      </label>

      <label class="toggle-row">
        <span class="toggle-label">
          <strong>Websites & Content</strong>
          <small>Sends prefers-color-scheme</small>
        </span>
        <input type="checkbox" id="chkWebsites" class="switch-checkbox">
        <span class="switch-slider"></span>
      </label>
    </div>

    <!-- Presets Quick Selection -->
    <div class="section-title" id="presetsTitle">Color Palette</div>
    <div class="presets-row" id="presetsContainer">
      <!-- Generated dynamically by popup.js -->
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span class="shortcut-tip">Shortcut: <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>D</kbd></span>
    </footer>
  </div>

  <script src="../shared/presets.js"></script>
  <script src="../shared/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
