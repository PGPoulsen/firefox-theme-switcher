<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <filter id="moonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#6366F1" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background circle for toolbar visibility -->
  <circle cx="24" cy="24" r="22" fill="#000000" fill-opacity="0.15" stroke="#818CF8" stroke-width="1.5" stroke-opacity="0.3"/>
  <!-- Crescent Moon -->
  <path d="M29.5 7.5C21.5 7.5 15 14 15 22C15 30 21.5 36.5 29.5 36.5C32.8 36.5 35.8 35.4 38.2 33.5C28.2 34.5 20.5 25.5 23 15.5C24.3 10.3 28.5 7.8 29.5 7.5Z" 
        fill="url(#moonGrad)" filter="url(#moonGlow)"/>
  <!-- Small twinkle stars -->
  <path d="M37 11L38 13.5L40.5 14.5L38 15.5L37 18L36 15.5L33.5 14.5L36 13.5Z" fill="url(#starGrad)"/>
  <circle cx="12" cy="14" r="1.5" fill="#E0E7FF" opacity="0.8"/>
  <circle cx="14" cy="31" r="1" fill="#E0E7FF" opacity="0.7"/>
