<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD000"/>
      <stop offset="100%" stop-color="#FF8A00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#FF8A00" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background circle for toolbar visibility -->
  <circle cx="24" cy="24" r="22" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFB000" stroke-width="1.5" stroke-opacity="0.2"/>
  <!-- Sun Center -->
  <circle cx="24" cy="24" r="10" fill="url(#sunGrad)" filter="url(#glow)"/>
  <!-- Sun Rays -->
  <g stroke="url(#sunGrad)" stroke-width="3" stroke-linecap="round">
    <line x1="24" y1="5" x2="24" y2="9"/>
    <line x1="24" y1="39" x2="24" y2="43"/>
    <line x1="5" y1="24" x2="9" y2="24"/>
    <line x1="39" y1="24" x2="43" y2="24"/>
    <line x1="10.5" y1="10.5" x2="13.5" y2="13.5"/>
    <line x1="34.5" y1="34.5" x2="37.5" y2="37.5"/>
    <line x1="10.5" y1="37.5" x2="13.5" y2="34.5"/>
    <line x1="34.5" y1="13.5" x2="37.5" y2="10.5"/>
  </g>
</svg>
